name: Temporary ORMap overview contours

"on":
  push:
    branches:
      - "agent/ormap-overview-contours"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: "agent/ormap-overview-contours"
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 .github/tmp/apply_ormap_overview_contours.py

      - name: Remove temporary CI helpers and commit integration
        run: |
          git rm .github/workflows/tmp-ormap-overview-contours.yml
          git rm .github/tmp/apply_ormap_overview_contours.py
          git config user.name "OpenRide CI"
          git config user.email "actions@users.noreply.github.com"
          git add CMakeLists.txt include/openride/ormap.h src/map/ormap_builder_v4.c
          git commit -m "Map: generalize overview landcover contours"

      - name: Focused mesh test
        run: |
          cc -std=c17 -Wall -Wextra -Wpedantic -Iinclude src/map/ormap_landcover_mesh.c tests/test_ormap_landcover_mesh.c -lm -o /tmp/test_ormap_landcover_mesh
          /tmp/test_ormap_landcover_mesh

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev
          ./scripts/bootstrap_sdl.sh

      - name: Build and test
        run: |
          sed -i '/cos=openride_ormap_cached_cos/d' CMakeLists.txt
          sed -i '/sin=openride_ormap_cached_sin/d' CMakeLists.txt
          cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E '^mbtiles$'
          git restore CMakeLists.txt
          test -z "$(git status --porcelain)"

      - name: Push validated commit
        run: git push origin HEAD:agent/ormap-overview-contours
