name: Apply LOD transition V1

on:
  push:
    branches:
      - chatgpt/lod-transition-v1

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply LOD transition patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              path.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label, flags=0):
              text = path.read_text()
              text2, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              path.write_text(text2)

          main = Path('src/main.c')
          world_h = Path('src/map/map_world.h')
          world_c = Path('src/map/map_world.c')
          renderer = Path('src/map/ormap_renderer.c')
          renderer_v4 = Path('src/map/ormap_renderer_v4.c')

          regex_once(
              main,
              r'''#ifdef __ANDROID__\n\s*const double OPENRIDE_ANDROID_DETAIL_ZOOM = 10\.75;\n\s*const bool world_overview_only = world_available\n\s*&& camera\.zoom < OPENRIDE_ANDROID_DETAIL_ZOOM;\n#else\n\s*const bool world_overview_only = world_available\n\s*&& camera\.zoom < OPENRIDE_MAP_WORLD_DETAIL_ZOOM;\n#endif''',
              '''const bool world_overview_only = world_available\n            && camera.zoom < OPENRIDE_MAP_WORLD_DETAIL_ZOOM;''',
              'remove Android hard z10.75 switch')

          replace_once(
              main,
              '''                openride_map_world_draw(map_world,\n                                        &camera,\n                                        map_style,\n                                        active_region ? active_region->id : NULL,\n                                        width,\n                                        height);''',
              '''                /* During the handoff, keep the active region's\n                 * generalized overview visible as the detailed ORMap fades in. */\n                openride_map_world_draw(map_world,\n                                        &camera,\n                                        map_style,\n                                        NULL,\n                                        width,\n                                        height);''',
              'overlay active-region overview during handoff')

          replace_once(
              world_h,
              '#define OPENRIDE_MAP_WORLD_MAX_OVERVIEW_ZOOM 12.0',
              '#define OPENRIDE_MAP_WORLD_MAX_OVERVIEW_ZOOM 11.30',
              'overview handoff end')

          replace_once(
              world_c,
              '''    const OpenRideMapPalette palette = openride_map_palette(style);\n    for (size_t i = 0U; i < world->region_count; ++i) {''',
              '''    const OpenRideMapPalette palette = openride_map_palette(style);\n    const double overview_handoff =\n        1.0 - openride_zoom_smoothstep(camera->zoom, 10.0, 11.30);\n    for (size_t i = 0U; i < world->region_count; ++i) {''',
              'world overview handoff factor')

          replace_once(
              world_c,
              '''        const double boundary_fade_out =\n            1.0 - openride_zoom_smoothstep(camera->zoom, 9.60, 10.70);\n        boundary.a = openride_scaled_alpha(boundary.a, boundary_fade_out);''',
              '''        const double boundary_fade_out =\n            1.0 - openride_zoom_smoothstep(camera->zoom, 9.60, 10.70);\n        boundary.a = openride_scaled_alpha(\n            boundary.a, boundary_fade_out * overview_handoff);''',
              'boundary handoff fade')

          replace_once(
              world_c,
              '''            if (road_class == OPENRIDE_ROAD_PRIMARY) {\n                const double primary_fade =\n                    openride_zoom_smoothstep(camera->zoom, 9.65, 10.55);\n                color.a = openride_scaled_alpha(190U, primary_fade);\n            }\n\n            int line_width = paint.width;''',
              '''            if (road_class == OPENRIDE_ROAD_PRIMARY) {\n                const double primary_fade =\n                    openride_zoom_smoothstep(camera->zoom, 9.65, 10.55);\n                color.a = openride_scaled_alpha(190U, primary_fade);\n            }\n            color.a = openride_scaled_alpha(color.a, overview_handoff);\n            if (color.a == 0U) continue;\n\n            int line_width = paint.width;''',
              'world road handoff fade')

          replace_once(
              world_c,
              '''static void draw_major_city_labels(OpenRideMapWorld *world,\n                                   const OpenRideMapCamera *camera,\n                                   const OpenRideMapPalette *palette,\n                                   int viewport_width,\n                                   int viewport_height)\n{\n    if (!world || !world->renderer || !camera || !palette) return;''',
              '''static void draw_major_city_labels(OpenRideMapWorld *world,\n                                   const OpenRideMapCamera *camera,\n                                   const OpenRideMapPalette *palette,\n                                   double opacity,\n                                   int viewport_width,\n                                   int viewport_height)\n{\n    if (!world || !world->renderer || !camera || !palette\n        || opacity <= 0.0) return;''',
              'world city label opacity parameter')

          replace_once(
              world_c,
              '''                SDL_SetRenderDrawColor(world->renderer,\n                                       palette->label_halo.r,\n                                       palette->label_halo.g,\n                                       palette->label_halo.b,\n                                       245U);''',
              '''                SDL_SetRenderDrawColor(world->renderer,\n                                       palette->label_halo.r,\n                                       palette->label_halo.g,\n                                       palette->label_halo.b,\n                                       openride_scaled_alpha(245U, opacity));''',
              'world city halo fade')

          replace_once(
              world_c,
              '''                SDL_SetRenderDrawColor(world->renderer,\n                                       palette->label.r,\n                                       palette->label.g,\n                                       palette->label.b,\n                                       SDL_ALPHA_OPAQUE);''',
              '''                SDL_SetRenderDrawColor(world->renderer,\n                                       palette->label.r,\n                                       palette->label.g,\n                                       palette->label.b,\n                                       openride_scaled_alpha(\n                                           SDL_ALPHA_OPAQUE, opacity));''',
              'world city text fade')

          replace_once(
              world_c,
              '''    draw_major_city_labels(world,\n                           camera,\n                           &palette,\n                           viewport_width,\n                           viewport_height);''',
              '''    draw_major_city_labels(world,\n                           camera,\n                           &palette,\n                           overview_handoff,\n                           viewport_width,\n                           viewport_height);''',
              'world city label handoff call')

          replace_once(
              renderer,
              '''static uint8_t ormap_scaled_alpha(uint8_t alpha, double factor)\n{\n    if (factor <= 0.0) return 0U;\n    if (factor >= 1.0) return alpha;\n    return (uint8_t)lround((double)alpha * factor);\n}\n''',
              '''static uint8_t ormap_scaled_alpha(uint8_t alpha, double factor)\n{\n    if (factor <= 0.0) return 0U;\n    if (factor >= 1.0) return alpha;\n    return (uint8_t)lround((double)alpha * factor);\n}\n\nstatic double ormap_detail_handoff_fade(double zoom)\n{\n    return ormap_zoom_smoothstep(zoom, 10.0, 11.30);\n}\n''',
              'shared ORMap handoff helper')

          regex_once(
              renderer,
              r'''static void draw_masks\(OpenRideORMapRenderer \*renderer,\n\s*const OpenRideMapCamera \*camera,\n\s*int width,\n\s*int height\)\n\{\n\s*if \(camera->zoom < 14\.0 \|\| camera->zoom > 17\.2\) return;\n\s*const OpenRideORMapMetadata \*metadata = openride_ormap_metadata\(renderer->map\);''',
              '''static void draw_masks(OpenRideORMapRenderer *renderer,\n                       const OpenRideMapCamera *camera,\n                       int width,\n                       int height)\n{\n    const OpenRideORMapMetadata *metadata = openride_ormap_metadata(renderer->map);\n    const bool v4 = metadata && metadata->format_version >= 4;\n    const double mask_start = v4 ? 13.40 : 14.0;\n    const double mask_end = v4 ? 14.40 : 14.50;\n    if (camera->zoom < mask_start || camera->zoom > 17.2) return;''',
              'v4 mask handoff range')

          replace_once(
              renderer,
              '''    const double mask_fade =\n        ormap_zoom_smoothstep(camera->zoom, 14.0, 14.50);''',
              '''    const double mask_fade =\n        ormap_zoom_smoothstep(camera->zoom, mask_start, mask_end);''',
              'mask fade uses shared v4 range')

          replace_once(
              renderer,
              '''static void draw_area_level(OpenRideORMapRenderer *renderer,\n                            const OpenRideMapCamera *camera,\n                            int width,\n                            int height,\n                            int zoom,\n                            bool draw_builtup,\n                            bool draw_water)''',
              '''static void draw_area_level(OpenRideORMapRenderer *renderer,\n                            const OpenRideMapCamera *camera,\n                            int width,\n                            int height,\n                            int zoom,\n                            bool draw_builtup,\n                            bool draw_water,\n                            double level_fade)''',
              'area level opacity parameter')

          replace_once(
              renderer,
              '''    const double water_fade =\n        ormap_zoom_smoothstep(camera->zoom, 10.75, 11.20);\n    const double builtup_fade =\n        ormap_zoom_smoothstep(camera->zoom, 13.0, 13.45);\n    ormap_scale_color_alpha(&water_color, water_fade);\n    ormap_scale_color_alpha(&builtup_color, builtup_fade);''',
              '''    const double water_fade =\n        ormap_detail_handoff_fade(camera->zoom) * level_fade;\n    const double builtup_fade =\n        ormap_zoom_smoothstep(camera->zoom, 13.0, 13.45) * level_fade;\n    ormap_scale_color_alpha(&water_color, water_fade);\n    ormap_scale_color_alpha(&builtup_color, builtup_fade);''',
              'area opacity composition')

          regex_once(
              renderer,
              r'''    if \(camera->zoom < 12\.5\) \{\n        draw_area_level\(renderer,\n                        camera,\n                        width,\n                        height,\n                        metadata->area_coarse_zoom,\n                        false,\n                        true\);\n    \} else \{\n        draw_area_level\(renderer,\n                        camera,\n                        width,\n                        height,\n                        metadata->area_detail_zoom,\n                        camera->zoom >= 13\.0,\n                        true\);\n    \}''',
              '''    const double detail_mix =\n        ormap_zoom_smoothstep(camera->zoom, 12.15, 12.85);\n    const bool legacy_detail_builtup =\n        metadata->format_version < 4 && camera->zoom >= 13.0;\n\n    if (detail_mix < 1.0) {\n        draw_area_level(renderer,\n                        camera,\n                        width,\n                        height,\n                        metadata->area_coarse_zoom,\n                        false,\n                        true,\n                        1.0 - detail_mix);\n    }\n    if (detail_mix > 0.0) {\n        draw_area_level(renderer,\n                        camera,\n                        width,\n                        height,\n                        metadata->area_detail_zoom,\n                        legacy_detail_builtup,\n                        true,\n                        detail_mix);\n    }''',
              'coarse detail area crossfade')

          replace_once(
              renderer,
              '''static void apply_android_road_fade(double zoom,\n                                    int road_class,\n                                    OpenRideMapRoadPaint *paint)\n{\n    if (!paint) return;\n    const double fade = android_road_class_fade(zoom, road_class);\n    ormap_scale_color_alpha(&paint->line, fade);\n    ormap_scale_color_alpha(&paint->casing, fade);\n}''',
              '''static void apply_road_fades(double zoom,\n                             int road_class,\n                             OpenRideMapRoadPaint *paint)\n{\n    if (!paint) return;\n    const double fade =\n        ormap_detail_handoff_fade(zoom)\n        * android_road_class_fade(zoom, road_class);\n    ormap_scale_color_alpha(&paint->line, fade);\n    ormap_scale_color_alpha(&paint->casing, fade);\n}''',
              'unified road handoff fade')

          replace_once(
              renderer,
              '''            apply_android_road_fade(\n                zoom,\n                road_class,\n                &table->paints[road_class]);''',
              '''            apply_road_fades(\n                zoom,\n                road_class,\n                &table->paints[road_class]);''',
              'road fade call')

          replace_once(
              renderer,
              '''    const double detail_label_fade =\n        ormap_zoom_smoothstep(camera->zoom, 10.70, 11.30);''',
              '''    const double detail_label_fade =\n        ormap_detail_handoff_fade(camera->zoom);''',
              'label shared handoff')

          replace_once(
              renderer,
              '''        const double label_fade = persistent_region_reference\n            ? 1.0\n            : detail_label_fade * label_fade_factor(kind, camera->zoom);''',
              '''        const double label_fade = persistent_region_reference\n            ? detail_label_fade\n            : detail_label_fade * label_fade_factor(kind, camera->zoom);''',
              'persistent label handoff')

          replace_once(
              renderer_v4,
              '''    if (camera->zoom < 9.20 || camera->zoom > 13.85) return;''',
              '''    if (camera->zoom < 10.0 || camera->zoom > 14.45) return;''',
              'v4 landcover visibility range')

          replace_once(
              renderer_v4,
              '''    const double urban_in = v4_smoothstep(camera->zoom, 9.70, 10.45);\n    const double green_in = v4_smoothstep(camera->zoom, 9.20, 10.05);\n    const double fade_out = 1.0 - v4_smoothstep(camera->zoom, 13.15, 13.75);\n    const OpenRideMapColor urban =\n        v4_builtup_color(renderer, false, urban_in * fade_out);\n    const OpenRideMapColor green =\n        v4_green_color(renderer, green_in * fade_out);''',
              '''    const double handoff_in =\n        v4_smoothstep(camera->zoom, 10.0, 11.30);\n    const double urban_out =\n        1.0 - v4_smoothstep(camera->zoom, 13.15, 13.75);\n    const double green_out =\n        1.0 - v4_smoothstep(camera->zoom, 13.40, 14.40);\n    const OpenRideMapColor urban =\n        v4_builtup_color(renderer, false, handoff_in * urban_out);\n    const OpenRideMapColor green =\n        v4_green_color(renderer, handoff_in * green_out);''',
              'v4 complementary landcover fades')

          replace_once(
              renderer_v4,
              '''    if (v4 && layer == OPENRIDE_ORMAP_RENDER_LAYER_AREAS) {\n        /* Low-zoom landcover stays below vector water, roads and labels. */\n        v4_draw_coarse_landcover(renderer,\n                               camera,\n                               viewport_width,\n                               viewport_height);\n    }\n\n    openride_ormap_renderer_draw_layer_legacy(renderer,''',
              '''    if (v4 && layer == OPENRIDE_ORMAP_RENDER_LAYER_MASKS) {\n        /* Coarse semantics are the background of the mask layer. Detailed\n         * forest/built-up masks are then drawn over them during the handoff. */\n        v4_draw_coarse_landcover(renderer,\n                                 camera,\n                                 viewport_width,\n                                 viewport_height);\n    }\n\n    openride_ormap_renderer_draw_layer_legacy(renderer,''',
              'v4 landcover layer ordering')

          checks = {
              main: ['OPENRIDE_MAP_WORLD_DETAIL_ZOOM'],
              world_h: ['OPENRIDE_MAP_WORLD_MAX_OVERVIEW_ZOOM 11.30'],
              world_c: ['overview_handoff', 'draw_major_city_labels'],
              renderer: ['ormap_detail_handoff_fade', '12.15, 12.85', 'mask_start'],
              renderer_v4: ['13.40, 14.40', 'handoff_in']
          }
          for path, needles in checks.items():
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing sanity marker {needle!r}')
          PY

          git diff --check
          git diff -- src/main.c src/map/map_world.h src/map/map_world.c \
            src/map/ormap_renderer.c src/map/ormap_renderer_v4.c

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config libsqlite3-dev zlib1g-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libxss-dev libxtst-dev

      - name: Bootstrap vendored dependencies
        run: |
          ./scripts/bootstrap_sdl.sh
          ./scripts/bootstrap_sqlite.sh

      - name: Configure desktop
        run: |
          cmake -S . -B build -G Ninja \
            -DOPENRIDE_BUILD_TESTS=ON \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF

      - name: Compile app and tests
        run: |
          cmake --build build --target openride
          cmake --build build

      - name: Run tests except external MBTiles fixture
        run: ctest --test-dir build --output-on-failure -E '^mbtiles$'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Build Android debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./scripts/android_build.sh

      - name: Commit validated LOD V1 patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/lod_v1_patch.yml
          git add src/main.c src/map/map_world.h src/map/map_world.c \
            src/map/ormap_renderer.c src/map/ormap_renderer_v4.c \
            .github/workflows/lod_v1_patch.yml
          git config user.name 'OpenRide CI'
          git config user.email 'openride-ci@users.noreply.github.com'
          git commit -m 'Map: smooth LOD transitions'
          git push origin HEAD:chatgpt/lod-transition-v1
