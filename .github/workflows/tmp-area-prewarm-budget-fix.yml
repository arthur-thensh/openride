name: Temporary area prewarm budget fix

on:
  push:
    branches:
      - agent/ormap-area-progressive-loading-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ormap-area-progressive-loading-v1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply single-prewarm fix
        run: |
          python3 .github/tmp/fix-area-prewarm-budget.py
          git diff --check
          test "$(grep -c 'prewarm_area_level(renderer' src/map/ormap_renderer.c)" -eq 1
          grep -q 'one-tile/frame budget must remain a hard ceiling' src/map/ormap_renderer.c

      - name: Create clean fix commit
        run: |
          git rm .github/tmp/fix-area-prewarm-budget.py
          git rm .github/workflows/tmp-area-prewarm-budget-fix.yml
          git config user.name "OpenRide CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/map/ormap_renderer.c
          git commit -m "Map: enforce single area prewarm budget"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libsqlite3-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          ./scripts/bootstrap_sdl.sh
          ./scripts/bootstrap_sqlite.sh

      - name: Build and test desktop
        run: |
          sed -i '/cos=openride_ormap_cached_cos/d' CMakeLists.txt
          sed -i '/sin=openride_ormap_cached_sin/d' CMakeLists.txt
          cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E '^mbtiles$'
          git restore CMakeLists.txt

      - name: Build production Android debug APK
        run: ./scripts/android_build.sh

      - name: Verify clean candidate and push
        run: |
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/ormap-area-progressive-loading-v1
