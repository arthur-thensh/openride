name: Temporary map zoom benchmark logging V1

on:
  push:
    branches:
      - agent/map-zoom-test-logging-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-zoom-test-logging-v1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply benchmark logging integration
        run: |
          python3 .github/tmp/apply-map-zoom-test-logging.py
          git diff --check
          grep -q 'map/map_zoom_test_logger.h' src/main.c
          grep -q 'map_zoom_test_logger.c' CMakeLists.txt
          grep -q 'SDL_GetTicksNS' src/main.c
          grep -q 'map-zoom-test.csv' src/main.c
          grep -q 'frame_ms_p99' src/map/map_zoom_test_logger.c
          test "$(grep -c 'openride_map_zoom_test_start(&map_zoom_test, &camera, &platform_paths)' src/main.c)" -eq 2
          test "$(grep -c 'openride_map_zoom_test_cancel(&map_zoom_test)' src/main.c)" -eq 2

      - name: Create clean candidate commit
        run: |
          git rm .github/tmp/apply-map-zoom-test-logging.py
          git rm .github/workflows/tmp-map-zoom-test-logging-v1.yml
          git config user.name "OpenRide CI"
          git config user.email "actions@users.noreply.github.com"
          git add CMakeLists.txt src/main.c src/map/map_zoom_test_logger.c src/map/map_zoom_test_logger.h
          git commit -m "DEV: log deterministic map zoom benchmark"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libsqlite3-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          ./scripts/bootstrap_sdl.sh
          ./scripts/bootstrap_sqlite.sh

      - name: Build and test desktop
        run: |
          sed -i '/cos=openride_ormap_cached_cos/d' CMakeLists.txt
          sed -i '/sin=openride_ormap_cached_sin/d' CMakeLists.txt
          cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E '^mbtiles$'
          git restore CMakeLists.txt

      - name: Build production Android debug APK
        run: ./scripts/android_build.sh

      - name: Verify clean candidate and push
        run: |
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/map-zoom-test-logging-v1
