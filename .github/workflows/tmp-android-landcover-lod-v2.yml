name: Temporary Android landcover LOD v2

"on":
  push:
    branches:
      - "agent/ormap-landcover-lod-v2"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/ormap-landcover-lod-v2"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap native dependencies
        run: |
          ./scripts/bootstrap_sdl.sh
          ./scripts/bootstrap_sqlite.sh

      - name: Build production Android debug APK
        run: ./scripts/android_build.sh
