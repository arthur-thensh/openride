name: OpenRide low-zoom landcover checkpoint

on:
  push:
    branches:
      - chatgpt/lowzoom-landcover

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cartographic pipeline patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{label}: start marker missing")
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:i] + replacement.rstrip() + "\n\n" + text[j:]

          # 1) Public v4 area kind: binary layout remains unchanged.
          p = Path('include/openride/ormap.h')
          s = p.read_text()
          s = replace_once(
              s,
              '''typedef enum OpenRideORMapAreaKind {
    OPENRIDE_ORMAP_AREA_BUILTUP = 1,
    OPENRIDE_ORMAP_AREA_WATER = 2
} OpenRideORMapAreaKind;''',
              '''typedef enum OpenRideORMapAreaKind {
    OPENRIDE_ORMAP_AREA_BUILTUP = 1,
    OPENRIDE_ORMAP_AREA_WATER = 2,
    OPENRIDE_ORMAP_AREA_GREEN = 3
} OpenRideORMapAreaKind;''',
              'ormap area kind')
          s = replace_once(
              s,
              ''' * In v4 this representation is used for water plus the coarse urban overview;
 * detailed built-up coverage stays in masks instead. Individual buildings are
 * therefore never emitted as area triangles by the final v4 post-process.''',
              ''' * In v4 this representation is used for water plus the coarse urban/green
 * overviews; detailed semantic coverage stays in masks instead. Individual
 * buildings are therefore never emitted as area triangles by the final v4
 * post-process.''',
              'ormap v4 area comment')
          p.write_text(s)

          # 2) Broaden OSM greenery classification. Keep agricultural land out so the
          # regional background remains restrained.
          p = Path('src/osm/osm_import.c')
          s = p.read_text()
          old = '''    if (tag_is(natural, "wood")
        || tag_is(landuse, "forest")
        || tag_is(leisure, "nature_reserve")) {
        return OPENRIDE_OSM_MAP_FEATURE_FOREST_AREA;
    }'''
          new = '''    if (tag_is(natural, "wood")
        || tag_is(natural, "grassland")
        || tag_is(natural, "scrub")
        || tag_is(natural, "heath")
        || tag_is(landuse, "forest")
        || tag_is(landuse, "grass")
        || tag_is(landuse, "meadow")
        || tag_is(landuse, "recreation_ground")
        || tag_is(landuse, "village_green")
        || tag_is(leisure, "park")
        || tag_is(leisure, "garden")
        || tag_is(leisure, "nature_reserve")) {
        return OPENRIDE_OSM_MAP_FEATURE_FOREST_AREA;
    }'''
          s = replace_once(s, old, new, 'OSM green classification')
          p.write_text(s)

          # 3) v4 builder: use a finer low-zoom grid, collect green landcover as a
          # second semantic mask, and apply a local majority cleanup to both layers.
          p = Path('src/map/ormap_builder_v4.c')
          s = p.read_text()
          s = replace_once(s, '#define V4_COARSE_GRID 64U', '#define V4_COARSE_GRID 128U', 'coarse grid')
          s = replace_once(
              s,
              '''typedef struct V4BuildContext {
    V4UrbanMaskMap urban;
} V4BuildContext;''',
              '''typedef struct V4BuildContext {
    V4UrbanMaskMap urban;
    V4UrbanMaskMap green;
} V4BuildContext;''',
              'build context')

          collect = r'''static bool v4_collect_landcover(OpenRideOSMMapFeatureKind kind,
                                   const double *latitudes,
                                   const double *longitudes,
                                   uint32_t point_count,
                                   void *userdata)
{
    V4BuildContext *context = userdata;
    if (!context || point_count == 0U) return true;

    V4UrbanMaskMap *target = NULL;
    if (kind == OPENRIDE_OSM_MAP_FEATURE_BUILTUP_AREA) {
        target = &context->urban;
    } else if (kind == OPENRIDE_OSM_MAP_FEATURE_FOREST_AREA) {
        target = &context->green;
    } else {
        return true;
    }

    /* Individual buildings arrive as a single representative point. They are
     * useful to consolidate urban fabric, but greenery must always be an area. */
    if (point_count == 1U) {
        if (kind != OPENRIDE_OSM_MAP_FEATURE_BUILTUP_AREA) return true;
        const double cells = (double)(1U << OPENRIDE_ORMAP_MASK_ZOOM)
            * OPENRIDE_ORMAP_MASK_GRID;
        const int64_t gx =
            (int64_t)floor(v4_mercator_x(longitudes[0]) * cells);
        const int64_t gy =
            (int64_t)floor(v4_mercator_y(latitudes[0]) * cells);
        return v4_set_global(target, gx, gy);
    }

    return v4_rasterize_polygon(target,
                                latitudes,
                                longitudes,
                                point_count);
}'''
          s = replace_between(s,
                              'static bool v4_collect_builtup(',
                              'static bool v4_merge_urban(',
                              collect,
                              'landcover collector')

          coarse = r'''static bool v4_build_coarse_map(const V4UrbanMaskMap *source,
                                V4CoarseMap *coarse)
{
    if (!source || !coarse) return false;
    /* z16 * 32 = z21 semantic cells; z11 * 128 = z18 overview cells. */
    const unsigned shift = 3U;
    for (uint32_t b = 0U; b < source->capacity; ++b) {
        const V4UrbanMaskBucket *bucket = &source->buckets[b];
        if (!bucket->used) continue;
        int tx = 0;
        int ty = 0;
        v4_decode_tile_key(bucket->key, &tx, &ty);
        for (uint32_t y = 0U; y < OPENRIDE_ORMAP_MASK_GRID; ++y) {
            for (uint32_t x = 0U; x < OPENRIDE_ORMAP_MASK_GRID; ++x) {
                if (!v4_bit_get(bucket->bits,
                                y * OPENRIDE_ORMAP_MASK_GRID + x)) {
                    continue;
                }
                const int64_t high_x =
                    (int64_t)tx * OPENRIDE_ORMAP_MASK_GRID + x;
                const int64_t high_y =
                    (int64_t)ty * OPENRIDE_ORMAP_MASK_GRID + y;
                if (!v4_coarse_set(coarse,
                                   high_x >> shift,
                                   high_y >> shift)) {
                    return false;
                }
            }
        }
    }
    return true;
}

static bool v4_coarse_get_global(const V4CoarseMap *map,
                                 int64_t gx,
                                 int64_t gy)
{
    if (!map || map->capacity == 0U || gx < 0 || gy < 0) return false;
    const int64_t global_cells =
        (int64_t)(1U << OPENRIDE_ORMAP_AREA_COARSE_ZOOM) * V4_COARSE_GRID;
    if (gx >= global_cells || gy >= global_cells) return false;
    const int tx = (int)(gx / V4_COARSE_GRID);
    const int ty = (int)(gy / V4_COARSE_GRID);
    const uint64_t key = v4_tile_key(tx, ty);
    uint32_t slot = v4_hash64(key) & (map->capacity - 1U);
    while (map->buckets[slot].used) {
        const V4CoarseBucket *bucket = &map->buckets[slot];
        if (bucket->key == key) {
            const uint32_t x = (uint32_t)(gx % V4_COARSE_GRID);
            const uint32_t y = (uint32_t)(gy % V4_COARSE_GRID);
            return v4_bit_get(bucket->bits, y * V4_COARSE_GRID + x);
        }
        slot = (slot + 1U) & (map->capacity - 1U);
    }
    return false;
}

static bool v4_smooth_coarse(V4CoarseMap *map)
{
    if (!map || map->capacity == 0U) return true;
    V4CoarseMap filtered = {0};
    for (uint32_t b = 0U; b < map->capacity; ++b) {
        const V4CoarseBucket *bucket = &map->buckets[b];
        if (!bucket->used) continue;
        int tx = 0;
        int ty = 0;
        v4_decode_tile_key(bucket->key, &tx, &ty);
        for (uint32_t y = 0U; y < V4_COARSE_GRID; ++y) {
            for (uint32_t x = 0U; x < V4_COARSE_GRID; ++x) {
                if (!v4_bit_get(bucket->bits, y * V4_COARSE_GRID + x)) continue;
                const int64_t gx = (int64_t)tx * V4_COARSE_GRID + x;
                const int64_t gy = (int64_t)ty * V4_COARSE_GRID + y;
                unsigned neighbours = 0U;
                for (int dy = -1; dy <= 1; ++dy) {
                    for (int dx = -1; dx <= 1; ++dx) {
                        if (v4_coarse_get_global(map, gx + dx, gy + dy)) {
                            ++neighbours;
                        }
                    }
                }
                /* Majority-ish cleanup: preserve coherent edges while dropping
                 * one-cell teeth and isolated raster artefacts. */
                if (neighbours >= 3U
                    && !v4_coarse_set(&filtered, gx, gy)) {
                    v4_coarse_destroy(&filtered);
                    return false;
                }
            }
        }
    }
    v4_coarse_destroy(map);
    *map = filtered;
    return true;
}'''
          s = replace_between(s,
                              'static bool v4_build_coarse_map(',
                              'static bool v4_decompress_blob(',
                              coarse,
                              'coarse landcover preparation')

          # Generalize the existing coarse writer so green and urban share the
          # exact same compact rectangle/triangle pipeline.
          start = s.find('static bool v4_append_coarse_builtup(')
          end = s.find('static bool v4_write_urban_masks(', start)
          if start < 0 or end < 0:
              raise SystemExit('coarse writer markers missing')
          writer = s[start:end]
          writer = replace_once(
              writer,
              '''static bool v4_append_coarse_builtup(sqlite3 *db,
                                     const V4CoarseMap *coarse,
                                     char *error,
                                     size_t error_size)''',
              '''static bool v4_append_coarse_layer(sqlite3 *db,
                                   const V4CoarseMap *coarse,
                                   uint8_t kind,
                                   char *error,
                                   size_t error_size)''',
              'coarse writer signature')
          writer = writer.replace('OPENRIDE_ORMAP_AREA_BUILTUP', 'kind')
          writer = writer.replace('coarse built-up area overflow', 'coarse landcover area overflow')
          writer = writer.replace('coarse urban tile', 'coarse landcover tile')
          s = s[:start] + writer + s[end:]

          post = r'''static bool v4_postprocess(const char *pbf_path,
                           const char *output_path,
                           char *error,
                           size_t error_size)
{
    V4BuildContext context = {0};
    OpenRideOSMMapFeatureStats feature_stats = {0};
    if (!openride_osm_pbf_visit_map_features(pbf_path,
                                              v4_collect_landcover,
                                              &context,
                                              &feature_stats,
                                              error,
                                              error_size)) {
        v4_urban_destroy(&context.green);
        v4_urban_destroy(&context.urban);
        return false;
    }

    if (!v4_merge_urban(&context.urban)
        || !v4_filter_sparse(&context.urban)
        || !v4_merge_urban(&context.green)
        || !v4_filter_sparse(&context.green)) {
        v4_urban_destroy(&context.green);
        v4_urban_destroy(&context.urban);
        v4_set_error(error, error_size, "unable to prepare v4 landcover masks");
        return false;
    }

    V4CoarseMap coarse_urban = {0};
    V4CoarseMap coarse_green = {0};
    if (!v4_build_coarse_map(&context.urban, &coarse_urban)
        || !v4_build_coarse_map(&context.green, &coarse_green)
        || !v4_smooth_coarse(&coarse_urban)
        || !v4_smooth_coarse(&coarse_green)) {
        v4_coarse_destroy(&coarse_green);
        v4_coarse_destroy(&coarse_urban);
        v4_urban_destroy(&context.green);
        v4_urban_destroy(&context.urban);
        v4_set_error(error, error_size, "unable to prepare v4 coarse landcover");
        return false;
    }

    sqlite3 *db = NULL;
    bool ok = sqlite3_open_v2(output_path,
                              &db,
                              SQLITE_OPEN_READWRITE,
                              NULL) == SQLITE_OK;
    if (!ok) {
        v4_set_error(error,
                     error_size,
                     db ? sqlite3_errmsg(db) : "unable to reopen .ormap for v4");
    }
    if (ok) {
        ok = sqlite3_exec(db, "BEGIN", NULL, NULL, NULL) == SQLITE_OK;
        if (!ok) v4_set_error(error, error_size, sqlite3_errmsg(db));
    }
    if (ok) ok = v4_filter_detail_builtup(db, error, error_size);
    /* Green first, urban second: urban remains visually dominant where the
     * simplified backgrounds overlap. Water stays in the legacy vector layer. */
    if (ok) {
        ok = v4_append_coarse_layer(db,
                                    &coarse_green,
                                    OPENRIDE_ORMAP_AREA_GREEN,
                                    error,
                                    error_size);
    }
    if (ok) {
        ok = v4_append_coarse_layer(db,
                                    &coarse_urban,
                                    OPENRIDE_ORMAP_AREA_BUILTUP,
                                    error,
                                    error_size);
    }
    if (ok) ok = v4_write_urban_masks(db, &context.urban, error, error_size);
    if (ok) {
        sqlite3_stmt *metadata = NULL;
        ok = sqlite3_prepare_v2(
            db,
            "INSERT INTO metadata(name,value) VALUES('format_version',?1) "
            "ON CONFLICT(name) DO UPDATE SET value=excluded.value",
            -1,
            &metadata,
            NULL) == SQLITE_OK;
        if (ok) {
            char version[16];
            snprintf(version, sizeof(version), "%u", OPENRIDE_ORMAP_FORMAT_VERSION);
            sqlite3_bind_text(metadata, 1, version, -1, SQLITE_TRANSIENT);
            ok = sqlite3_step(metadata) == SQLITE_DONE;
        }
        if (!ok) v4_set_error(error, error_size, sqlite3_errmsg(db));
        if (metadata) sqlite3_finalize(metadata);
    }
    if (db) {
        if (ok) {
            ok = sqlite3_exec(db, "COMMIT", NULL, NULL, NULL) == SQLITE_OK;
            if (!ok) v4_set_error(error, error_size, sqlite3_errmsg(db));
        } else {
            sqlite3_exec(db, "ROLLBACK", NULL, NULL, NULL);
        }
        sqlite3_close(db);
    }

    v4_coarse_destroy(&coarse_green);
    v4_coarse_destroy(&coarse_urban);
    v4_urban_destroy(&context.green);
    v4_urban_destroy(&context.urban);
    return ok;
}'''
          s = replace_between(s,
                              'static bool v4_postprocess(',
                              'bool openride_ormap_build(',
                              post,
                              'v4 postprocess')
          p.write_text(s)

          # 4) v4 renderer: green and urban use the same low-zoom vector LOD.
          # Green appears slightly earlier and always remains a subdued backdrop.
          p = Path('src/map/ormap_renderer_v4.c')
          s = p.read_text()
          coarse_draw = r'''static OpenRideMapColor v4_green_color(OpenRideORMapRenderer *renderer,
                                       double factor)
{
    OpenRideMapColor color;
    if (renderer->style == OPENRIDE_MAP_STYLE_TOPO) {
        color = (OpenRideMapColor){180U, 203U, 170U, 150U};
    } else if (renderer->style == OPENRIDE_MAP_STYLE_TRAIL) {
        color = (OpenRideMapColor){194U, 210U, 184U, 118U};
    } else {
        color = (OpenRideMapColor){207U, 216U, 201U, 98U};
    }
    color.a = v4_scaled_alpha(color.a, factor);
    return color;
}

static void v4_draw_coarse_landcover(OpenRideORMapRenderer *renderer,
                                     const OpenRideMapCamera *camera,
                                     int width,
                                     int height)
{
    if (camera->zoom < 9.20 || camera->zoom > 13.85) return;
    const OpenRideORMapMetadata *metadata = openride_ormap_metadata(renderer->map);
    if (!metadata || metadata->format_version < 4) return;

    const double urban_in = v4_smoothstep(camera->zoom, 9.70, 10.45);
    const double green_in = v4_smoothstep(camera->zoom, 9.20, 10.05);
    const double fade_out = 1.0 - v4_smoothstep(camera->zoom, 13.15, 13.75);
    const OpenRideMapColor urban =
        v4_builtup_color(renderer, false, urban_in * fade_out);
    const OpenRideMapColor green =
        v4_green_color(renderer, green_in * fade_out);
    if (urban.a == 0U && green.a == 0U) return;

    const int zoom = metadata->area_coarse_zoom;
    const int count = 1 << zoom;
    double tile_size = 0.0;
    double center_x = 0.0;
    double center_y = 0.0;
    int first_x = 0, last_x = 0, first_y = 0, last_y = 0;
    V4Rotation rotation;
    v4_visible_tile_range(camera,
                          width,
                          height,
                          zoom,
                          &tile_size,
                          &center_x,
                          &center_y,
                          &first_x,
                          &last_x,
                          &first_y,
                          &last_y,
                          &rotation);

    V4GeometryBatch batch = {0};
    /* Two passes guarantee the intended background hierarchy even if a tile
     * also contains legacy area records: green first, then urban. */
    const uint8_t kinds[2] = {
        OPENRIDE_ORMAP_AREA_GREEN,
        OPENRIDE_ORMAP_AREA_BUILTUP
    };
    for (uint32_t pass = 0U; pass < 2U; ++pass) {
        const uint8_t kind = kinds[pass];
        const OpenRideMapColor color =
            kind == OPENRIDE_ORMAP_AREA_GREEN ? green : urban;
        if (color.a == 0U) continue;
        for (int ty = first_y; ty <= last_y; ++ty) {
            if (ty < 0 || ty >= count) continue;
            for (int tx = first_x; tx <= last_x; ++tx) {
                const int qx = v4_wrap_x(tx, count);
                OpenRideORMapAreaCacheEntry *entry =
                    v4_area_cache_slot(renderer, zoom, qx, ty);
                if (!entry || entry->tile.count == 0U) continue;
                const double left = width * 0.5 + tx * tile_size - center_x;
                const double top = height * 0.5 + ty * tile_size - center_y;
                for (uint32_t i = 0U; i < entry->tile.count; ++i) {
                    const OpenRideORMapAreaTriangle *triangle =
                        &entry->tile.triangles[i];
                    if (triangle->kind != kind) continue;
                    const uint16_t xs[3] = {
                        triangle->x1, triangle->x2, triangle->x3
                    };
                    const uint16_t ys[3] = {
                        triangle->y1, triangle->y2, triangle->y3
                    };
                    float x[3];
                    float y[3];
                    float min_x = FLT_MAX;
                    float min_y = FLT_MAX;
                    float max_x = -FLT_MAX;
                    float max_y = -FLT_MAX;
                    for (uint32_t v = 0U; v < 3U; ++v) {
                        x[v] = (float)(left
                            + v4_decode_area_coord(xs[v]) * tile_size);
                        y[v] = (float)(top
                            + v4_decode_area_coord(ys[v]) * tile_size);
                        v4_rotate_point(&rotation, &x[v], &y[v]);
                        if (x[v] < min_x) min_x = x[v];
                        if (x[v] > max_x) max_x = x[v];
                        if (y[v] < min_y) min_y = y[v];
                        if (y[v] > max_y) max_y = y[v];
                    }
                    if (max_x < -2.0f || min_x > width + 2.0f
                        || max_y < -2.0f || min_y > height + 2.0f) {
                        continue;
                    }
                    if (!v4_batch_triangle(renderer, &batch, x, y, color)) {
                        v4_batch_flush(renderer, &batch);
                        return;
                    }
                }
            }
        }
        v4_batch_flush(renderer, &batch);
    }
}'''
          s = replace_between(s,
                              'static void v4_draw_coarse_builtup(',
                              'static void v4_draw_detail_builtup(',
                              coarse_draw,
                              'coarse landcover renderer')
          s = replace_once(s,
                           'v4_draw_coarse_builtup(renderer,',
                           'v4_draw_coarse_landcover(renderer,',
                           'coarse renderer call')
          s = replace_once(s,
                           '/* Urban overview goes below vector water, never over it. */',
                           '/* Low-zoom landcover stays below vector water, roads and labels. */',
                           'renderer hierarchy comment')
          p.write_text(s)

          # Small regression guard for the new kind without coupling tests to
          # renderer internals.
          p = Path('tests/test_ormap.c')
          s = p.read_text()
          s = replace_once(s,
                           '    assert(argc == 2);\n',
                           '    assert(argc == 2);\n    assert(OPENRIDE_ORMAP_AREA_GREEN == 3);\n',
                           'green area test guard')
          p.write_text(s)
          PY

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libsqlite3-dev zlib1g-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev

      - name: Bootstrap SDL
        run: ./scripts/bootstrap_sdl.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit validated checkpoint on work branch
        shell: bash
        run: |
          rm .github/workflows/lowzoom-landcover-once.yml
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/openride/ormap.h src/osm/osm_import.c \
                  src/map/ormap_builder_v4.c src/map/ormap_renderer_v4.c \
                  tests/test_ormap.c .github/workflows/lowzoom-landcover-once.yml
          git commit -m "Map: add smoothed low-zoom green landcover"
          git push origin HEAD:chatgpt/lowzoom-landcover
