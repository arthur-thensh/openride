name: Validate LOD V1 Android production build

on:
  push:
    branches:
      - chatgpt/lod-transition-v1

permissions:
  contents: write

jobs:
  android-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply already desktop-validated LOD patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/lod_v1_retry.yml').read_text()
          marker = '      - name: Reuse and refine LOD source patch\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          start = workflow.index(run_marker, start) + len(run_marker)
          end = workflow.index('\n      - name: Install desktop build dependencies', start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_lod_v1_refined.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply_lod_v1_refined.sh
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          "${ANDROID_HOME}/platform-tools/adb" version

      - name: Build production Android debug APK
        run: ./scripts/android_build.sh

      - name: Commit validated LOD V1 source changes
        shell: bash
        run: |
          rm -f \
            .github/workflows/lod_v1_patch.yml \
            .github/workflows/lod_v1_retry.yml \
            .github/workflows/lod_v1_android_retry.yml
          git add src/main.c src/map/map_world.h src/map/map_world.c \
            src/map/ormap_renderer.c src/map/ormap_renderer_v4.c \
            .github/workflows/lod_v1_patch.yml \
            .github/workflows/lod_v1_retry.yml \
            .github/workflows/lod_v1_android_retry.yml
          git diff --cached --check
          git config user.name 'OpenRide CI'
          git config user.email 'openride-ci@users.noreply.github.com'
          git commit -m 'Map: smooth LOD transitions'
          git push origin HEAD:chatgpt/lod-transition-v1
