name: Temporary road label LOD v1

"on":
  push:
    branches:
      - "agent/ormap-road-label-lod-v1"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: "agent/ormap-road-label-lod-v1"
          fetch-depth: 0

      - name: Apply road and label LOD patch
        run: python3 .github/tmp/apply_road_label_lod_v1.py

      - name: Remove temporary helpers and commit candidate
        run: |
          git rm .github/workflows/tmp-road-label-lod-v1.yml
          git rm .github/tmp/apply_road_label_lod_v1.py
          git config user.name "OpenRide CI"
          git config user.email "actions@users.noreply.github.com"
          git add include/openride/ormap.h src/map/ormap_builder.c src/map/ormap.c src/map/ormap_renderer.c src/tools/ormap_import_main.c tests/test_ormap.c
          git commit -m "Map: add road and label LODs"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libsqlite3-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          ./scripts/bootstrap_sdl.sh

      - name: Build and test
        run: |
          sed -i '/cos=openride_ormap_cached_cos/d' CMakeLists.txt
          sed -i '/sin=openride_ormap_cached_sin/d' CMakeLists.txt
          cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E '^mbtiles$'
          git restore CMakeLists.txt
          test -z "$(git status --porcelain)"

      - name: Push validated commit
        run: git push origin HEAD:agent/ormap-road-label-lod-v1
