name: apply-road-lod-v2

on:
  push:
    branches:
      - agent/road-lod-v2
    paths:
      - .github/workflows/apply-road-lod-v2.yml
      - tools/apply_road_lod_v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/road-lod-v2
          fetch-depth: 0

      - name: Apply source edit
        run: |
          python3 tools/apply_road_lod_v2.py
          rm tools/apply_road_lod_v2.py
          rm .github/workflows/apply-road-lod-v2.yml
          git config user.name "openride-agent"
          git config user.email "openride-agent@users.noreply.github.com"
          git add -A
          git commit -m "Map: simplify road LOD geometry"
          git push origin HEAD:agent/road-lod-v2
