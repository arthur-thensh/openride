name: Temporary road LOD dedup V1

on:
  push:
    branches:
      - agent/ormap-road-lod-dedup-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ormap-road-lod-dedup-v1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply road LOD dedup V1
        run: |
          python3 .github/tmp/apply-road-lod-dedup-v1.py
          git diff --check
          grep -q 'ROAD_LOD_GROUP_PRIMARY' src/map/ormap_renderer.c
          grep -q 'tiles_visited' src/map/ormap_renderer.h
          grep -q 'road_work_line' src/main.c

      - name: Create clean candidate commit
        run: |
          git rm .github/tmp/apply-road-lod-dedup-v1.py
          git rm .github/workflows/tmp-road-lod-dedup-v1.yml
          git config user.name "OpenRide CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/map/ormap_renderer.c src/map/ormap_renderer.h src/main.c
          git commit -m "Map: deduplicate road LOD handoffs"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libsqlite3-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          ./scripts/bootstrap_sdl.sh
          ./scripts/bootstrap_sqlite.sh

      - name: Build and test desktop
        run: |
          sed -i '/cos=openride_ormap_cached_cos/d' CMakeLists.txt
          sed -i '/sin=openride_ormap_cached_sin/d' CMakeLists.txt
          cmake -S . -B build -G Ninja -DOPENRIDE_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E '^mbtiles$'
          git restore CMakeLists.txt

      - name: Build production Android debug APK
        run: ./scripts/android_build.sh

      - name: Verify clean candidate and push
        run: |
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/ormap-road-lod-dedup-v1
